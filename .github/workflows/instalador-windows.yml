name: Instalador Windows de Mamatlatolli

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: instalador-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instalador:
    name: Setup de Mamatlatolli
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            empaquetado/requirements-build.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r empaquetado/requirements-build.txt

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: Inno Setup 6.7.3
        shell: pwsh
        run: |
          $destino = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $destino
          Start-Process -FilePath $destino -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "No se instaló ISCC.exe" }
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Construir instalador
        run: python empaquetado/construir.py

      - name: Publicar Setup y portable
        uses: actions/upload-artifact@v4
        with:
          name: Mamatlatolli-Windows
          if-no-files-found: error
          path: |
            dist/Mamatlatolli-Setup.exe
            dist/Mamatlatolli-portable.zip
